<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF2F5;--ink:#1B2A3A;--muted:#51606F;--teal:#0F7C8A;--amber:#F2B544;
  --head:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;--body:"Source Sans 3",Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:18px/1.6 var(--body);padding:24px}
main{max-width:640px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1;margin:0 0 .4em}
p{color:var(--muted);margin:0 0 1.4em}
a.go{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;
  padding:14px 26px;border-radius:6px;box-shadow:5px 5px 0 var(--amber)}
a.go:hover{background:var(--teal)}
a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Database Learning Lab</h1>
  <p>An interactive website for learning how databases work. Explore database concepts, manage sample student records, try SQL, watch videos, take quizzes, and ask the database chatbot.</p>
  <a class="go" href="database.html">Open the learning website</a>
</main>
</body>
</html>
